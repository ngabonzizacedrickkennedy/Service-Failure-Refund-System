spring.application.name=Notification-Reporting-Service
server.port=${PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notificatio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Novemba@42}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Internal event API key (shared across services for X-Internal-Key auth)
internal.api-key=${INTERNAL_API_KEY:ssfrs-internal-2024}

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}
