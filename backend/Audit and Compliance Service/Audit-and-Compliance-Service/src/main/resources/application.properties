spring.application.name=Audit-and-Compliance-Service
server.port=${PORT:8087}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditcomp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Novemba@42}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Internal event API key — verified on every /api/internal/** endpoint
internal.api-key=${INTERNAL_API_KEY:ssfrs-internal-2024}

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}

# AI service base URL for fetching geolocation details
ai.service.url=${AI_SERVICE_URL:http://localhost:8083}

# User Management Service URL — used to resolve actor names at ingestion time
user.management.url=${USER_MANAGEMENT_URL:http://localhost:8081}
