spring.application.name=ProjectWorker-Execution-Service
# Local-only real secrets live here (gitignored). Absent on Render → env vars fill the ${...} placeholders below.
spring.config.import=optional:classpath:/application-local.properties
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/execution_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Novemba@42}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Must match Service 1's jwt.secret exactly
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}

aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=service-refund
aws.s3.region=eu-north-1
# Key prefixes served as plain, permanent URLs instead of 60-minute presigned
# ones. Set to project-images/ ONLY after the bucket policy grants public
# s3:GetObject on that prefix. Evidence and CV folders must never be listed here.
aws.s3.public-prefixes=${AWS_S3_PUBLIC_PREFIXES:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

internal.api-key=${INTERNAL_API_KEY:ssfrs-internal-2024}
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8083}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8087}
user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}

momo.base-url=${MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
momo.subscription-key=${MOMO_SUBSCRIPTION_KEY:}
momo.api-user=${MOMO_API_USER:}
momo.api-key=${MOMO_API_KEY:}
momo.target-environment=sandbox
momo.currency=EUR

# Caching is in-memory (ConcurrentMapCacheManager) — no Redis/external cache needed.
