spring.application.name=Evaluation-Decision-Service
# Local-only real secrets live here (gitignored). Absent on Render → env vars fill the ${...} placeholders below.
spring.config.import=optional:classpath:/application-local.properties
server.port=${PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/execution_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Novemba@42}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

internal.api-key=${INTERNAL_API_KEY:ssfrs-internal-2024}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
refund.service.url=${REFUND_SERVICE_URL:http://localhost:8086}
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8087}

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}

# Resend HTTP API (https://resend.com) — sent over HTTPS (443), not SMTP, because
# Render blocks outbound SMTP ports (25/465/587). RESEND_API_KEY is your Resend API
# key; MAIL_PASSWORD is honoured as a fallback (it held the same key under the old SMTP setup).
resend.api-key=${RESEND_API_KEY:${MAIL_PASSWORD:}}
# Sender address — must be on a domain you verified in Resend.
app.mail.from=${MAIL_FROM:info@ufbconsulting.com}

# Public URL of the frontend, used to build login links in emails.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=service-refund
aws.s3.region=eu-north-1
