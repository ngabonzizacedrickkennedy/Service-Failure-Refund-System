spring.application.name=User-Management-Service
# Local-only real secrets live here (gitignored). Absent on Render → env vars fill the ${...} placeholders below.
spring.config.import=optional:classpath:/application-local.properties
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_manage_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Novemba@42}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

internal.api-key=${INTERNAL_API_KEY:ssfrs-internal-2024}
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8087}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}
jwt.expiration-ms=86400000

aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=service-refund
aws.s3.region=eu-north-1

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Resend SMTP (https://resend.com) — username is literally "resend", password is the Resend API key.
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sender address — must be on a domain you verified in Resend.
app.mail.from=${MAIL_FROM:info@ufbconsulting.com}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Caching is in-memory (ConcurrentMapCacheManager) — no Redis/external cache needed.

